name: Build Linux Binary & Docker Image

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install NPM Dependencies
        run: |
          cd src
          npm install --legacy-peer-deps
          npm rebuild argon2 --build-from-source || true

      - name: Package Standalone Linux Binary via pkg
        run: |
          npm install -g pkg
          cd src
          pkg -c ./package.json -t node18-linux-x64 bin/www -o ../ztncui
          chmod +x ../ztncui

      - name: Package Tarball with Addons
        run: |
          mkdir -p dist/argon2-addon
          cp ztncui dist/
          if [ -f src/node_modules/argon2/build/Release/argon2.node ]; then
            cp src/node_modules/argon2/build/Release/argon2.node dist/argon2-addon/
          fi
          cd dist
          tar -czvf ../ztncui-linux-x64.tar.gz ztncui argon2-addon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ztncui-linux-x64
          path: |
            ztncui
            ztncui-linux-x64.tar.gz
          retention-days: 30

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "ztncui-linux-x64 (Modern Vue 3 SPA)"
          body: |
            ### ztncui Modern Vue 3 SPA + ZeroTier Controller
            - Modern Single Page Application (Vite 5 + Vue 3)
            - 100% Pug-free clean architecture
            - High concurrency background member pagination & batching
            - Complete i18n localization (zh-CN & en-US)
            - Hardened security (Origin check, rate limiting, secure session secrets)

            #### Option 1: Docker Image (GHCR)
            ```bash
            docker pull ghcr.io/nicotinamide/ztncui:latest
            # Or via China acceleration mirror:
            docker pull gh.lale.live/ghcr.io/nicotinamide/ztncui:latest
            ```

            #### Option 2: Binary Hot-swap
            ```bash
            curl -L https://gh.lale.live/https://github.com/Nicotinamide/ztncui/releases/download/latest/ztncui -o /root/ztncui
            chmod +x /root/ztncui
            docker cp /root/ztncui ztncui:/opt/key-networks/ztncui/ztncui
            docker restart ztncui
            ```
          files: |
            ztncui
            ztncui-linux-x64.tar.gz

  build-docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
